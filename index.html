<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LiFi Torch TX (2-4-4) — Torch + Fallback</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; margin: 16px; line-height: 1.35; }
  .row { margin: 10px 0; }
  textarea { width: 100%; height: 110px; }
  input[type="number"] { width: 90px; }
  button { padding: 10px 14px; margin-right: 6px; }
  #status { padding: 8px; border: 1px solid #ddd; border-radius: 6px; min-height: 24px; background:#fafafa; }
  #flashOverlay { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 9999; pointer-events: none; background: black; display: none; }
  .warn { color: #b51212; font-weight: 600; }
  .ok { color: #0a871b; font-weight: 600; }
</style>
</head>
<body>
<h2>LiFi Torch Transmitter (2-4-4)</h2>

<div class="row" id="httpsWarn" style="display:none;">
  <span class="warn">Προσοχή:</span> Η πρόσβαση σε κάμερα/φακό συνήθως απαιτεί <b>HTTPS</b> (ή localhost).
</div>

<div class="row">
  <button id="enable">1) Ενεργοποίηση κάμερας/φακού</button>
  <button id="torchOn">Test Torch ON</button>
  <button id="torchOff">Test Torch OFF</button>
</div>

<div class="row">
  <label>Μήνυμα:</label><br/>
  <textarea id="msg" placeholder="Γράψε το κείμενο που θα σταλεί..."></textarea>
</div>

<div class="row">
  <label>Base unit (ms):</label>
  <input id="unit" type="number" min="1" max="200" value="12"/>
  <label style="margin-left:16px;"><input id="framing" type="checkbox"/> Preamble / Length / Checksum</label>
  <label style="margin-left:16px;"><input id="screenFallback" type="checkbox"/> Χρήση οθόνης ως fallback</label>
</div>

<div class="row">
  <button id="send">Αποστολή</button>
  <button id="stop">Διακοπή</button>
</div>

<div id="status" class="row">Έτοιμο.</div>
<div id="flashOverlay"></div>

<script>
(() => {
  let sending = false;
  let stream = null;
  let videoTrack = null;
  let imageCapture = null;
  let torchByConstraints = false;
  let torchByImageCapture = false;

  const statusEl = document.getElementById('status');
  const overlay = document.getElementById('flashOverlay');
  const screenFallbackChk = document.getElementById('screenFallback');

  function log(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls ? ('row ' + cls) : 'row';
  }

  // HTTPS warning
  try {
    const isHttps = (location.protocol === 'https:' || location.hostname === 'localhost');
    if (!isHttps) document.getElementById('httpsWarn').style.display = 'block';
  } catch (_) {}

  async function enableCameraTorch() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      videoTrack = stream.getVideoTracks()[0];

      // Try constraints torch
      try {
        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (caps && 'torch' in caps) {
          await videoTrack.applyConstraints({ advanced: [{ torch: true }] });
          torchByConstraints = true;
          log('Βρέθηκε φακός (constraints).', 'ok');
          await videoTrack.applyConstraints({ advanced: [{ torch: false }] });
        }
      } catch (e) {}

      // Fallback ImageCapture
      if (!torchByConstraints) {
        try {
          imageCapture = new ImageCapture(videoTrack);
          if (imageCapture.setOptions) {
            await imageCapture.setOptions({ torch: true });
            torchByImageCapture = true;
            log('Βρέθηκε φακός (ImageCapture).', 'ok');
            await imageCapture.setOptions({ torch: false });
          }
        } catch (e) {}
      }

      if (!torchByConstraints && !torchByImageCapture) {
        log('Δεν μπόρεσα να ενεργοποιήσω φακό από browser. Χρησιμοποίησε HTTPS ή το fallback οθόνης.', 'warn');
      }
    } catch (e) {
      log('Σφάλμα κατά το άνοιγμα κάμερας: ' + e.message, 'warn');
    }
  }

  async function setTorch(on) {
    try {
      if (torchByConstraints && videoTrack) {
        await videoTrack.applyConstraints({ advanced: [{ torch: !!on }] });
        return;
      }
      if (torchByImageCapture && imageCapture) {
        await imageCapture.setOptions({ torch: !!on });
        return;
      }
    } catch (e) { }
    if (screenFallbackChk.checked) {
      overlay.style.display = 'block';
      overlay.style.background = on ? 'white' : 'black';
    }
  }

  function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

  function encodeFrame(bytes) {
    const out = [];
    out.push(0x55, 0x55);
    out.push(0x02);
    const len = bytes.length & 0xFF;
    out.push(len);
    let sum = len;
    for (const b of bytes) { out.push(b); sum = (sum + (b & 0xFF)) & 0xFF; }
    out.push(sum & 0xFF);
    out.push(0x03);
    return new Uint8Array(out);
  }

  async function sendBit(bit, unit) {
    await setTorch(true); await sleep(2 * unit);
    await setTorch(bit ? true : false); await sleep(4 * unit);
    await setTorch(false); await sleep(4 * unit);
  }
  async function sendByte(byte, unit) {
    for (let i=0;i<8;i++) await sendBit((byte>>i)&1, unit);
  }
  async function sendBytes(bytes, unit) {
    for (const b of bytes) await sendByte(b, unit);
  }

  async function startSend() {
    if (sending) return;
    sending = true;
    if (screenFallbackChk.checked) overlay.style.display = 'block';

    try {
      const unit = Math.max(1, Math.min(200, parseInt(document.getElementById('unit').value || '12')));
      const text = (document.getElementById('msg').value || "").trim();
      if (!text) { log('Γράψε κάτι πρώτα.'); sending = false; overlay.style.display = 'none'; return; }

      const enc = new TextEncoder();
      const payload = enc.encode(text);
      const useFraming = document.getElementById('framing').checked;
      const data = useFraming ? encodeFrame(payload) : payload;

      log('Μετάδοση...');
      await sendBytes(data, unit);
      if (!useFraming) await sleep(unit*6);
      log('Ολοκληρώθηκε.', 'ok');
    } catch (e) {
      log('Σφάλμα: ' + e.message, 'warn');
    } finally {
      await setTorch(false);
      sending = false;
      overlay.style.display = 'none';
    }
  }

  function stopSend() {
    sending = false;
    setTorch(false);
    overlay.style.display = 'none';
    log('Διακόπηκε.');
  }

  document.getElementById('enable').addEventListener('click', enableCameraTorch);
  document.getElementById('torchOn').addEventListener('click', () => setTorch(true));
  document.getElementById('torchOff').addEventListener('click', () => setTorch(false));
  document.getElementById('send').addEventListener('click', startSend);
  document.getElementById('stop').addEventListener('click', stopSend);

  log('Έτοιμο. 1) Πάτησε "Ενεργοποίηση κάμερας/φακού". Αν δεν λειτουργήσει ο φακός, ενεργοποίησε "Χρήση οθόνης ως fallback".');
})();
</script>
</body>
</html>
